# Secret scanning gate.
#
# STATUS: manual-dispatch only. Automatic triggers are intentionally commented
# out so this workflow cannot block anything until CY enables them.
#
# To activate as a required gate, uncomment the push / pull_request triggers
# below. Repository members with bypass permission can still merge; make it a
# required status check in branch protection for enforcement.
#
# The scanner is `tools/secret-scan.mjs` — dependency-free, runs on any Node 20+
# runner, and prints MASKED excerpts only. It exits 1 on findings, 2 on
# pattern-loading failure (so a broken scanner can never report a false clean).
name: Secret scan

on:
  # push:
  #   branches: ["main"]
  # pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan working tree for committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run secret scan
        run: node tools/secret-scan.mjs --root .
